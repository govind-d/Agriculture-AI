
services:
  # ─── MongoDB (local dev fallback) ─────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: agriguardian-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: agriguardian

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: agriguardian-api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=agriguardian
      - JWT_SECRET=dev-secret-change-in-production
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongo_data:
